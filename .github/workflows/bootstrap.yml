name: Bootstrap ISO Field Graph

on:
  push:
    paths:
      - project-bootstrap.tar.gz

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project source
        run: tar --no-same-owner --no-same-permissions -xzf project-bootstrap.tar.gz
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Refresh sanitized public metadata
        run: python scripts/sync_catalog.py
      - name: Verify schema and catalogue
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_metadata.py
      - name: Commit initialized project and catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm project-bootstrap.tar.gz .github/workflows/bootstrap.yml
          git add -A
          git commit -m 'Initialize ISO Field Graph and sanitized metadata'
          git push origin HEAD:main
